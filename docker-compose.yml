
services:
  db:
    image: mysql:8.0
    container_name: task-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}

    volumes:
      - db-data:/var/lib/mysql
      - ./src/main/resources/db/taskdb.sql:/docker-entrypoint-initdb.d/taskdb.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      - task-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${APP_IMAGE:-task-app:latest}
    container_name: task-app
    restart: unless-stopped

    ports:
      - "8083:8083"

    environment:
      DB_NAME: ${DB_NAME}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - task-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  task-network:
    driver: bridge

volumes:
  db-data:
    name: task-db-data
