
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean assemble --no-daemon

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  build-and-push-image:
    name: build-and-push-image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"

          docker build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-$SHA" .

          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$SHA"

  deploy:
    name: deploy
    needs: build-and-push-image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:sha-$SHA"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "APP_IMAGE='$IMAGE' bash -se" <<'EOF'
          set -euo pipefail

          cd /opt/duongapp/session-12-task-api-practical

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          test -f .env

          echo "Pulling image..."
          docker pull "$APP_IMAGE"

          echo "Deploying..."
          export APP_IMAGE
          docker compose config --quiet
          docker compose up -d --no-build --wait --wait-timeout 180

          echo "Checking API..."
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8083/api/tasks >/dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 5
          done

          docker compose ps
          docker logs --tail 80 task-app
          exit 1
          EOF
